spring.application.name=produtos-ms

# Porta do servidor (diferente do vendas-ms que usa 8080)
server.port=8082

# Desabilitar Docker Compose automático (gerenciar containers manualmente)
spring.docker.compose.enabled=false

# Banco de dados (MySQL via Docker Compose)
spring.datasource.url=jdbc:mysql://localhost:3307/produtosdb
spring.datasource.username=root
spring.datasource.password=root

# JPA: none para usar Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Necessario para que o Thymeleaf processe forms com method="put"/"delete" via _method
spring.mvc.hiddenmethod.filter.enabled=true
spring.messages.fallback-to-system-locale=false

# OAuth2 GitHub
spring.security.oauth2.client.registration.github.client-id=${OAUTH_PRODUTOS_MS_CLIENT_ID_GIT:change-me}
spring.security.oauth2.client.registration.github.client-secret=${OAUTH_PRODUTOS_MS_SECRET_ID_GIT:change-me}
spring.security.oauth2.client.registration.github.scope[0]=read:user

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=false

# Actuator
# Expose all endpoints (health, info, prometheus, metrics, etc.)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
# Tag all metrics with the application name for easier filtering
management.metrics.tags.application=${spring.application.name}

# Zipkin (distributed tracing)
# Send 100% of traces to Zipkin (reduce to e.g. 0.1 in production)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ActiveMQ
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
