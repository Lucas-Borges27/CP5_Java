<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.produtos}">Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
<div class="max-w-5xl mx-auto p-4">
    <div th:replace="~{fragments.html :: navbar('produtos')}"></div>

    <div class="bg-white p-6 mt-4 shadow-md rounded-md">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-bold text-gray-800" th:text="#{produto.list.title}">Produtos</h1>
            <a sec:authorize="hasRole('PRODUTO')" th:href="@{/produtos/novo}" class="px-4 py-2 bg-gray-800 text-white rounded"
               th:text="#{produto.list.new}">Novo produto</a>
        </div>

        <div th:if="${#lists.isEmpty(produtos)}" class="py-10 text-center text-gray-500"
             th:text="#{produto.list.empty}">
            Nenhum produto cadastrado.
        </div>

        <table th:unless="${#lists.isEmpty(produtos)}" class="w-full border-collapse">
            <thead>
            <tr class="border-b text-left">
                <th class="py-3" th:text="#{produto.table.code}">Codigo</th>
                <th class="py-3" th:text="#{produto.table.name}">Nome</th>
                <th class="py-3" th:text="#{produto.table.category}">Categoria</th>
                <th class="py-3" th:text="#{produto.table.price}">Preco</th>
                <th class="py-3" th:text="#{produto.table.actions}">Acoes</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="produto : ${produtos}" class="border-b">
                <td class="py-3 pr-2" th:text="${produto.codigo}">uuid</td>
                <td class="py-3 pr-2" th:text="${produto.nome}">Notebook</td>
                <td class="py-3 pr-2" th:text="${produto.categoria}">Eletronicos</td>
                <td class="py-3 pr-2" th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">0,00</td>
                <td class="py-3">
                    <div sec:authorize="hasRole('PRODUTO')" class="flex gap-2">
                        <a th:href="@{/produtos/detalhe/{codigo}(codigo=${produto.codigo})}"
                           class="px-3 py-2 bg-gray-200 rounded"
                           th:text="#{produto.table.details}">Detalhar</a>
                        <form th:action="@{/produtos/excluir}" method="post"
                              onsubmit="return confirm(this.dataset.message)"
                              th:attr="data-message=#{produto.delete.confirm}">
                            <input type="hidden" name="codigo" th:value="${produto.codigo}">
                            <button type="submit" class="px-3 py-2 bg-red-100 text-red-700 rounded"
                                    th:text="#{produto.table.delete}">Excluir</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
